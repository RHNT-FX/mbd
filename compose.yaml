version: '3.8'
services:
  db:
    image: postgres:17
    container_name: pos_jalur_langit_db
    environment:
      POSTGRES_USER: pos_admin
      POSTGRES_PASSWORD: pos_password
      POSTGRES_DB: pos_jalur_langit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
